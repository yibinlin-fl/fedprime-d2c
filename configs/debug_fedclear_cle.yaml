experiment_name: debug_fedclear_cle_alpha05_gamma09
method_name: fedclear
seed: 0
device: auto
num_workers: 0
output_root: outputs

data:
  scenario: cle_hfl
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_cle/alpha05_gamma09_seed0
  public_root: RAHFL-master/Dataset/cifar_100
  num_classes: 10
  public_size: 512
  download_public: false

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 2
  local_epochs: 1
  batch_size: 16
  test_batch_size: 128
  public_batch_size: 32
  public_batches_per_round: 1
  max_local_batches: 2
  max_test_batches: 2
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  cl_module: ccre
  lambda_jsd: 12.0
  counterfactual_views:
    num_views: 3
    operators: [identity, gaussian_noise, blur, brightness, contrast, pixelate, haze]
    noise_std: 0.08
    blur_kernel: 3
    brightness_strength: 0.20
    contrast_strength: 0.30
    pixelate_size: 16
    haze_strength: 0.20
  ccre:
    lambda_ccre: 1.0
    temperature: 0.5
  communication: ird
  ird:
    warmup_rounds: 1
    lambda_ird: 1.0
    temperature: 2.0
    smooth_temperature: 0.5
    max_grad_norm: 1.0
    num_views: 3
    operators: [identity, gaussian_noise, blur, brightness, contrast, pixelate, haze]
    noise_std: 0.08
    blur_kernel: 3
    brightness_strength: 0.20
    contrast_strength: 0.30
    pixelate_size: 16
    haze_strength: 0.20

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
