experiment_name: debug_fedclear_pccd_alpha05_gamma09_seed0
method_name: fedclear_pccd
seed: 0
device: auto
num_workers: 0
output_root: outputs

data:
  scenario: cle_hfl
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_cle/alpha05_gamma09_seed0
  public_dataset: cifar10_npy
  public_root: local_runs/cle_hfl_indomain_public/cle_hfl_indomain_public_alpha05_gamma09_seed0
  num_classes: 10
  public_size: 128
  download_public: false

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 2
  local_epochs: 1
  batch_size: 16
  test_batch_size: 128
  public_batch_size: 32
  public_batches_per_round: 1
  max_local_batches: 2
  max_test_batches: 2
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  augmix_module: jsd
  cl_module: dcl
  lambda_jsd: 12.0
  communication: pccd
  pccd:
    warmup_rounds: 1
    lambda_pccd: 1.0
    max_grad_norm: 1.0
    num_views: 3
    operators: [identity, gaussian_noise, blur, brightness, contrast, pixelate, haze]
    noise_std: 0.08
    blur_kernel: 3
    brightness_strength: 0.20
    contrast_strength: 0.30
    pixelate_size: 16
    haze_strength: 0.20

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
