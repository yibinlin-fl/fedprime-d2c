experiment_name: debug_fedease_oracle_ebst_v2
method_name: fedease
seed: 0
device: auto
num_workers: 0
output_root: local_test_outputs

data:
  scenario: cle_hfl
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_cle/alpha05_gamma09_seed0
  public_root: RAHFL-master/Dataset/cifar_100
  num_classes: 10
  public_size: 0
  download_public: false

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 2
  local_epochs: 1
  batch_size: 16
  test_batch_size: 64
  public_batch_size: 64
  public_batches_per_round: 0
  max_local_batches: 2
  max_test_batches: 1
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  augmix_module: jsd
  cl_module: fedease
  lambda_jsd: 12.0
  communication: ebst_v2
  fedease:
    environment_mode: oracle
    num_environments: 4
    preserve_dcl: true
    ber:
      enabled: true
      support_gamma: 0.5
      count_cap: 32
      min_group_count: 1
    cdep:
      enabled: true
      projection_dim: 16
      min_class_count: 2
      lambda: 0.05
      eps: 1.0e-5
    ebst:
      enabled: true
      version: 2
      warmup_rounds: 1
      min_group_support: 1
      min_pair_class_support: 1
      min_source_clients: 1
      lambda: 0.25
      huber_delta: 1.0
      eps: 1.0e-6
      stability_gate:
        enabled: true
        variance_temperature: 0.5
    scp:
      enabled: true
      scope: classifier_class
      max_communication_norm_ratio: 1.0
      eps: 1.0e-12
    evaluation:
      splits: [clean, same, random, swapped, unseen]
      max_batches: 1

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
