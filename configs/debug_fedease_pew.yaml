experiment_name: debug_fedease_pew
method_name: fedease
seed: 0
device: auto
num_workers: 0
output_root: local_test_outputs

data:
  scenario: cle_hfl
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_cle/alpha05_gamma09_seed0
  public_root: RAHFL-master/Dataset/cifar_100
  num_classes: 10
  public_size: 96
  download_public: false

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 1
  local_epochs: 1
  batch_size: 16
  test_batch_size: 64
  public_batch_size: 16
  public_batches_per_round: 0
  max_local_batches: 1
  max_test_batches: 1
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  augmix_module: jsd
  cl_module: fedease
  lambda_jsd: 12.0
  communication: none
  fedease:
    environment_mode: learned
    num_environments: 6
    preserve_dcl: true
    pew:
      embedding_dim: 8
      severity_levels: 5
      unknown_threshold: 0.55
      epochs: 1
      learning_rate: 0.001
      public_size: 96
      batch_size: 16
      inference_batch_size: 512
      validation_fraction: 0.25
      max_batches: 2
      reuse_checkpoint: false
    ber:
      enabled: true
      support_gamma: 0.5
      count_cap: 32
      min_group_count: 1
    cdep:
      enabled: true
      projection_dim: 16
      min_class_count: 2
      lambda: 0.05
    ebst:
      enabled: false
    evaluation:
      splits: [random]
      max_batches: 1

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
