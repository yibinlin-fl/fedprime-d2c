experiment_name: debug_fedfalsify_cle_alpha05_gamma09_seed0
method_name: fedfalsify
seed: 0
device: auto
num_workers: 0
output_root: outputs

data:
  scenario: cle_hfl
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_cle/alpha05_gamma09_seed0
  public_root: RAHFL-master/Dataset/cifar_100
  num_classes: 10

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 2
  local_epochs: 1
  batch_size: 16
  test_batch_size: 64
  max_local_batches: 2
  max_test_batches: 2
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  augmix_module: jsd
  cl_module: dcl
  lambda_jsd: 12.0
  communication: fedfalsify
  fedfalsify:
    warmup_rounds: 1
    route_interval: 1
    split:
      path: outputs/partitions/fedfalsify_v1_cle_alpha05_gamma09_seed0.npz
      audit_ratio: 0.15
      min_audit_per_class: 5
      min_fit_per_class: 2
    router:
      fit_samples_per_class: 4
      audit_samples_per_class: 5
      min_fit_count: 2
      min_audit_count: 5
      min_tau: 0.0
      fra_weight: 0.0
      fra_kappa: 1.0
      fra_shrinkage_nu: 10.0
    transfer:
      lambda_cmt: 0.5
      margin_clip: 2.0
      source_correct_only: true

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
  save_final: false
