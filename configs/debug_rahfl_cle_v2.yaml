experiment_name: debug_rahfl_cle_v2
method_name: rahfl
seed: 0
device: auto
num_workers: 0
output_root: local_test_outputs

data:
  scenario: cle_hfl_v2
  private_dataset: cifar10
  private_root: local_runs/cle_hfl_v2_smoke/cle_hfl_v2_prepared_debug_alpha05_gamma09_seed0_split0/cifar_10_cle_v2/debug_alpha05_gamma09_seed0_split0
  public_root: RAHFL-master/Dataset/cifar_100
  public_size: 128
  download_public: false
  num_classes: 10

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 1
  local_epochs: 1
  batch_size: 32
  test_batch_size: 256
  public_batch_size: 64
  public_batches_per_round: 1
  max_local_batches: 2
  max_test_batches: 2
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  augmix_module: jsd
  cl_module: dcl
  lambda_jsd: 12.0
  communication: asymhfl

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
  save_final: false
