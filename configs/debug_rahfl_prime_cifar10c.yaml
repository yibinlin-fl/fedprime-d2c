experiment_name: debug_rahfl_prime_cifar10c
method_name: rahfl_prime
seed: 0
device: auto
num_workers: 0
# Keep local smoke artifacts separate from the mounted/ACL-restricted outputs.
output_root: local_runs

data:
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_c
  # Local readable CIFAR-100 copy used only for the smoke test.
  public_root: outputs/local_debug_data/cifar_100
  num_classes: 10
  private_corrupt_rate: 1
  test_corrupt_rate: 1
  public_size: 512
  download_public: false
  partition: dirichlet
  dirichlet_alpha: 0.5
  private_samples_per_client: 512
  partition_indices_path: outputs/partitions/debug_cifar10c_alpha05_seed0_clients4_samples512.npz

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  rounds: 1
  local_epochs: 1
  batch_size: 64
  test_batch_size: 256
  public_batch_size: 64
  public_batches_per_round: 1
  max_local_batches: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: true
  use_dcl: true
  cl_module: dcl
  lambda_jsd: 12.0
  prime:
    mixture_width: 3
    mixture_depth: -1
    max_depth: 3
    no_jsd: false
    enabled_primitives: [diffeo, color, filter]

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
