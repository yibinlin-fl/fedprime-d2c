experiment_name: debug_sara_local_only_cifar10c
method_name: prac_hfl
seed: 0
device: auto
num_workers: 0
output_root: outputs

data:
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_c
  public_root: RAHFL-master/Dataset/cifar_100
  num_classes: 10
  private_corrupt_rate: 1
  test_corrupt_rate: 1
  public_size: 512
  download_public: false
  partition: dirichlet
  dirichlet_alpha: 0.5
  private_samples_per_client: 10000
  partition_indices_path: outputs/partitions/cifar10c_alpha05_seed0_clients4_samples10000.npz

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  rounds: 1
  local_epochs: 1
  batch_size: 64
  test_batch_size: 256
  public_batch_size: 128
  public_batches_per_round: 1
  max_local_batches: 2
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 1
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  augmix_module: jsd
  cl_module: sara
  lambda_jsd: 12.0
  sara:
    lambda_sara: 1.0
    temperature: 0.2
    relation_temperature: 0.2
    beta: 1.0
    class_weight_min: 0.75
    class_weight_max: 1.5
    class_weight_power: 0.5
    reliability_tau: 1.0
    reliability_min: 0.05
    use_class_calibration: true
    use_view_reliability: true
    use_relation_alignment: true
  prac:
    # Larger than train.rounds, so this debug run tests only AugMix + SARA.
    warmup_rounds: 999
    num_candidate_teachers: 3
    classwise: true
    temperature: 3.0
    virtual_lr: 0.005
    head_max_grad_norm: 1.0
    positive_margin: 0.0
    gate_tau: 0.05
    accept_epsilon: 0.0
    risk_lambda_aug: 0.0
    risk_lambda_js: 0.0

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
