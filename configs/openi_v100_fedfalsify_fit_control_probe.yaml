experiment_name: probe_fedfalsify_fit_control_alpha05_gamma09_seed0
method_name: fedfalsify
seed: 0
device: auto
num_workers: 2
output_root: outputs

data:
  scenario: cle_hfl
  private_dataset: cifar10
  private_root: RAHFL-master/Dataset/cifar_10_cle/alpha05_gamma09_seed0
  public_root: RAHFL-master/Dataset/cifar_100
  num_classes: 10

models:
  names: [ResNet10, ResNet12, ShuffleNet, Mobilenetv2]

train:
  pretrain_epochs: 0
  rounds: 12
  local_epochs: 1
  batch_size: 64
  test_batch_size: 512
  max_grad_norm: 5.0
  skip_nonfinite: true
  local_log_interval: 50
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

method:
  use_prime: false
  augmix_module: jsd
  cl_module: dcl
  lambda_jsd: 12.0
  communication: none
  fedfalsify:
    enabled: false
    warmup_rounds: 3
    split:
      path: outputs/partitions/fedfalsify_v1_cle_alpha05_gamma09_seed0.npz
      audit_ratio: 0.15
      min_audit_per_class: 5
      min_fit_per_class: 2

checkpoints:
  load_dir:
  resume: false
  resume_dir:
  strict: true
  save_final: false
